<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2024 Initiative Tracker</title>
    <style>
        :root {
            --ice-blue: #e0f2fe;
            --deep-frost: #0c4a6e;
            --magic-cyan: #0ea5e9;
            --snow: #f8fafc;
            --bg3-adv: #ffcc00; 
            --bg3-dis: #ff4400;
            --exhaust-red: #fca5a5;
        }

        body {
            font-family: "Palatino Linotype", "Book Antiqua", Palatino, serif;
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
            background: linear-gradient(rgba(0, 10, 30, 0.7), rgba(0, 10, 30, 0.7)), 
                        url('https://wallpaperaccess.com/full/5135733.jpg');
            background-size: cover; background-position: center; background-attachment: fixed;
            color: var(--ice-blue); overflow-x: hidden;
        }

        .snowflake {
            color: #fff; position: fixed; top: -10%; z-index: 9999;
            user-select: none; animation: snowfall linear infinite; pointer-events: none;
        }
        @keyframes snowfall {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(110vh) rotate(360deg); }
        }

        .frosted-card {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--magic-cyan); border-radius: 12px;
            max-width: 950px; width: 100%; padding: 25px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8); z-index: 10;
        }

        h1 { font-variant: small-caps; text-align: center; text-shadow: 0 0 15px var(--magic-cyan); margin: 0 0 10px 0; }
        .round-counter { text-align: center; font-size: 1.2rem; color: var(--magic-cyan); margin-bottom: 15px; font-weight: bold;}

        .input-row {
            display: grid; grid-template-columns: 2fr 1fr auto; gap: 8px;
            background: rgba(255, 255, 255, 0.1); padding: 12px; border-radius: 6px; margin-bottom: 15px;
        }

        input, select { background: rgba(255,255,255,0.95); border: none; padding: 10px; border-radius: 4px; font-family: inherit; color: #333; }

        .btn-roll { 
            width: 100%; background: linear-gradient(to bottom, #0ea5e9, #0284c7); 
            color: white; font-size: 1.2rem; padding: 12px; border: none;
            border-radius: 6px; cursor: pointer; margin-bottom: 20px; font-variant: small-caps; font-weight: bold;
            box-shadow: 0 4px 0 #0369a1;
        }

        table { width: 100%; border-collapse: collapse; }
        th { border-bottom: 1px solid var(--magic-cyan); padding: 10px; color: var(--magic-cyan); text-align: left; font-variant: small-caps; font-size: 0.85rem; }
        td { padding: 12px 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); vertical-align: middle; }

        .total-roll { font-size: 1.5rem; font-weight: bold; color: #fff; line-height: 1;}
        .math { font-size: 0.75rem; color: var(--magic-cyan); display: block; margin-top: 4px; }
        .exhaust-penalty { color: var(--exhaust-red); font-weight: bold; }

        .bg3-icon-container { display: flex; gap: 10px; align-items: center; }
        .chevron {
            cursor: pointer; width: 20px; height: 20px; position: relative;
            opacity: 0.2; transition: 0.3s; filter: grayscale(1);
        }

        .adv-chevron::before, .adv-chevron::after {
            content: ''; position: absolute; width: 10px; height: 10px;
            border-left: 3px solid var(--bg3-adv); border-top: 3px solid var(--bg3-adv);
            transform: rotate(45deg); left: 5px;
        }
        .adv-chevron::after { top: 6px; }

        .dis-chevron::before, .dis-chevron::after {
            content: ''; position: absolute; width: 10px; height: 10px;
            border-right: 3px solid var(--bg3-dis); border-bottom: 3px solid var(--bg3-dis);
            transform: rotate(45deg); left: 5px;
        }
        .dis-chevron::after { top: 6px; }

        .active-adv { opacity: 1; filter: grayscale(0) drop-shadow(0 0 5px var(--bg3-adv)); }
        .active-dis { opacity: 1; filter: grayscale(0) drop-shadow(0 0 5px var(--bg3-dis)); }

        .status-pill {
            background: rgba(14, 165, 233, 0.3); border: 1px solid var(--magic-cyan);
            padding: 2px 8px; border-radius: 4px; font-size: 11px; margin: 2px; display: inline-flex; align-items: center;
        }

        .icon-btn { background: none; border: none; cursor: pointer; font-size: 1.2rem; transition: 0.2s; padding: 5px; }
    </style>
</head>
<body>

<div class="frosted-card">
    <h1>Frozen Initiative (2024)</h1>
    <div class="round-counter">❄️ ROUND <span id="roundNum">0</span> ❄️</div>
    
    <div class="input-row">
        <input type="text" id="name" placeholder="Name">
        <input type="number" id="mod" placeholder="Dex Modifier">
        <button onclick="addParticipant()" style="background:var(--magic-cyan); color:white; border:none; padding:8px 15px; border-radius:4px; cursor:pointer; font-weight:bold;">ADD</button>
    </div>

    <button class="btn-roll" onclick="nextRound()">🧊 Shatter the Ice (Next Round) 🧊</button>

    <table>
        <thead>
            <tr>
                <th style="width:25%">Combatant</th>
                <th style="width:10%">Adv/Dis</th>
                <th style="width:15%">Exhaustion</th>
                <th style="width:15%">Initiative</th>
                <th style="width:25%">Conditions</th>
                <th style="width:10%"></th>
            </tr>
        </thead>
        <tbody id="initBody"></tbody>
    </table>
    
    <button onclick="clearAll()" style="background:none; border:1px solid #ef4444; color:#ef4444; font-size:10px; margin-top:20px; cursor:pointer; padding:5px; border-radius:4px;">WIPE ALL DATA</button>
</div>

<script>
    let participants = JSON.parse(localStorage.getItem('dnd_init_data')) || [];
    let round = parseInt(localStorage.getItem('dnd_init_round')) || 0;
    let editingIndex = null;
    const conditions = ["Blinded", "Charmed", "Deafened", "Frightened", "Grappled", "Incapacitated", "Invisible", "Paralyzed", "Petrified", "Poisoned", "Prone", "Restrained", "Stunned", "Unconscious"];

    function saveToStorage() {
        localStorage.setItem('dnd_init_data', JSON.stringify(participants));
        localStorage.setItem('dnd_init_round', round);
    }

    function createSnowflake() {
        const snow = document.createElement('div');
        snow.innerHTML = "❄";
        snow.classList.add('snowflake');
        snow.style.left = Math.random() * 100 + 'vw';
        snow.style.animationDuration = Math.random() * 3 + 4 + 's';
        snow.style.fontSize = Math.random() * 10 + 10 + 'px';
        snow.style.opacity = Math.random() * 0.5 + 0.3;
        document.body.appendChild(snow);
        setTimeout(() => { snow.remove(); }, 7000);
    }
    setInterval(createSnowflake, 300);

    function parseValue(val, fallback) {
        let parsed = parseInt(val);
        return isNaN(parsed) ? fallback : parsed;
    }

    // Logic for BG3 style Advantage/Disadvantage rolls
    function rollD20(adv, dis) {
        if (adv) return Math.max(Math.floor(Math.random()*20)+1, Math.floor(Math.random()*20)+1);
        if (dis) return Math.min(Math.floor(Math.random()*20)+1, Math.floor(Math.random()*20)+1);
        return Math.floor(Math.random()*20)+1;
    }

    // Advanced Tie-Breaker Sorting
    function sortParticipants() {
        participants.sort((a, b) => {
            // 1. Initiative Total
            if (b.current !== a.current) return b.current - a.current;
            // 2. Dex Modifier
            if (b.mod !== a.mod) return b.mod - a.mod;
            // 3. Final Reroll Tie-breaker (stored internally to keep sort stable)
            if (!a.tieBreak) a.tieBreak = Math.random();
            if (!b.tieBreak) b.tieBreak = Math.random();
            return b.tieBreak - a.tieBreak;
        });
    }

    function addParticipant() {
        const n = document.getElementById('name').value;
        const m = parseValue(document.getElementById('mod').value, 0);
        if (!n) return;

        const nat = rollD20(false, false);
        participants.push({ 
            name: n, mod: m, 
            current: nat + m, nat: nat, 
            statuses: [], adv: false, dis: false, 
            exhaustion: 0, tieBreak: Math.random() 
        });
        
        document.getElementById('name').value = '';
        sortParticipants();
        saveToStorage();
        render();
    }

    function nextRound() {
        round++;
        participants.forEach(p => {
            p.nat = rollD20(p.adv, p.dis);
            p.current = p.nat + p.mod - (p.exhaustion * 2);
            p.tieBreak = Math.random(); // New random seed for ties this round
        });
        sortParticipants();
        saveToStorage();
        render();
    }

    function updateExhaustion(i, level) {
        participants[i].exhaustion = parseInt(level);
        participants[i].current = participants[i].nat + participants[i].mod - (participants[i].exhaustion * 2);
        sortParticipants();
        saveToStorage();
        render();
    }

    function toggleAdv(i) {
        participants[i].adv = !participants[i].adv;
        if (participants[i].adv) participants[i].dis = false;
        saveToStorage();
        render();
    }

    function toggleDis(i) {
        participants[i].dis = !participants[i].dis;
        if (participants[i].dis) participants[i].adv = false;
        saveToStorage();
        render();
    }

    function clearAll() {
        if(confirm("Wipe all data?")) {
            participants = []; round = 0; saveToStorage(); location.reload();
        }
    }

    function toggleEdit(i) { editingIndex = (editingIndex === i) ? null : i; render(); }

    function saveEdit(i) {
        participants[i].name = document.getElementById(`e-name-${i}`).value;
        participants[i].mod = parseValue(document.getElementById(`e-mod-${i}`).value, 0);
        participants[i].current = participants[i].nat + participants[i].mod - (participants[i].exhaustion * 2);
        sortParticipants();
        editingIndex = null;
        saveToStorage();
        render();
    }

    function render() {
        document.getElementById('roundNum').innerText = round;
        const tbody = document.getElementById('initBody');
        tbody.innerHTML = '';
        participants.forEach((p, i) => {
            const tr = document.createElement('tr');
            if (p.exhaustion >= 6) tr.style.opacity = "0.5";
            
            if (editingIndex === i) {
                tr.innerHTML = `<td colspan="3"><input id="e-name-${i}" value="${p.name}" style="width:60%"> <input type="number" id="e-mod-${i}" value="${p.mod}" style="width:50px"></td><td colspan="2">Editing...</td><td><button class="icon-btn" onclick="saveEdit(${i})">💾</button></td>`;
            } else {
                tr.innerHTML = `
                    <td><strong>${p.name}</strong><br><small style="color:var(--magic-cyan)">Dex Mod: ${p.mod >= 0 ? '+' + p.mod : p.mod}</small></td>
                    <td>
                        <div class="bg3-icon-container">
                            <div class="chevron adv-chevron ${p.adv ? 'active-adv' : ''}" onclick="toggleAdv(${i})"></div>
                            <div class="chevron dis-chevron ${p.dis ? 'active-dis' : ''}" onclick="toggleDis(${i})"></div>
                        </div>
                    </td>
                    <td>
                        <select onchange="updateExhaustion(${i}, this.value)" style="width:100%; font-size:11px; ${p.exhaustion > 0 ? 'background:var(--exhaust-red)' : ''}">
                            ${[0,1,2,3,4,5,6].map(l => `<option value="${l}" ${p.exhaustion==l?'selected':''}>Lvl ${l}${l==6?' (Dead)':''}</option>`).join('')}
                        </select>
                    </td>
                    <td>
                        <span class="total-roll">${p.exhaustion >= 6 ? '💀' : p.current}</span>
                        <span class="math">(${p.nat}${p.mod >= 0 ? '+' + p.mod : p.mod}${p.exhaustion > 0 ? `<span class="exhaust-penalty">-${p.exhaustion*2}</span>` : ''})</span>
                    </td>
                    <td>
                        <div style="max-height: 50px; overflow-y: auto;">
                            ${p.statuses.map((s, si) => `<span class="status-pill">${s} <span onclick="participants[${i}].statuses.splice(${si},1);saveToStorage();render();" style="cursor:pointer;margin-left:5px">×</span></span>`).join('')}
                        </div>
                        <select onchange="if(this.value){participants[${i}].statuses.push(this.value);saveToStorage();render();}" style="display:block; font-size:10px; margin-top:4px; width:100px;">
                            <option value="">+ Status</option>
                            ${conditions.map(c => `<option value="${c}">${c}</option>`).join('')}
                        </select>
                    </td>
                    <td>
                        <button class="icon-btn" onclick="toggleEdit(${i})">✍️</button>
                        <button class="icon-btn" onclick="participants.splice(${i},1);saveToStorage();render();">☠️</button>
                    </td>
                `;
            }
            tbody.appendChild(tr);
        });
    }
    render();
</script>
</body>
</html>
