<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2024 Initiative & HP Tracker</title>
    <style>
        :root {
            --ice-blue: #e0f2fe;
            --deep-frost: #0c4a6e;
            --magic-cyan: #0ea5e9;
            --snow: #f8fafc;
            --bg3-adv: #ffcc00; 
            --bg3-dis: #ff4400;
            --exhaust-red: #fca5a5;
            --hp-green: #22c55e;
            --hp-red: #ef4444;
            --player-glow: #0ea5e9;
            --enemy-glow: #ef4444;
            --ally-glow: #22c55e;
        }

        body {
            font-family: "Palatino Linotype", "Book Antiqua", Palatino, serif;
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
            /* REPLACE 'YOUR_RAW_GITHUB_URL_HERE' with your actual raw link */
            background: linear-gradient(rgba(0, 10, 30, 0.7), rgba(0, 10, 30, 0.7)), 
                        url('https://raw.githubusercontent.com/feresrafael/dnd-initiative-tracker/refs/heads/main/tracker_background.jpg');
            background-size: cover; background-position: center; background-attachment: fixed;
            color: var(--ice-blue); overflow-x: hidden;
        }

        .snowflake {
            color: #fff; position: fixed; top: -10%; z-index: 9999;
            user-select: none; animation: snowfall linear infinite; pointer-events: none;
        }
        @keyframes snowfall {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(110vh) rotate(360deg); }
        }

        .frosted-card {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--magic-cyan); border-radius: 12px;
            max-width: 1200px; width: 100%; padding: 25px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8); z-index: 10;
        }

        h1 { font-variant: small-caps; text-align: center; text-shadow: 0 0 15px var(--magic-cyan); margin: 0 0 10px 0; }
        .round-counter { text-align: center; font-size: 1.2rem; color: var(--magic-cyan); margin-bottom: 15px; font-weight: bold;}

        .input-row {
            display: grid; grid-template-columns: 2fr 1fr 0.8fr 0.8fr 0.8fr auto; gap: 8px;
            background: rgba(255, 255, 255, 0.1); padding: 12px; border-radius: 6px; margin-bottom: 15px;
        }

        input, select { background: rgba(255,255,255,0.95); border: none; padding: 10px; border-radius: 4px; font-family: inherit; color: #333; width: 100%; box-sizing: border-box; }

        .btn-roll { 
            width: 100%; background: linear-gradient(to bottom, #0ea5e9, #0284c7); 
            color: white; font-size: 1.2rem; padding: 12px; border: none;
            border-radius: 6px; cursor: pointer; margin-bottom: 20px; font-variant: small-caps; font-weight: bold;
            box-shadow: 0 4px 0 #0369a1;
        }

        table { width: 100%; border-collapse: collapse; }
        th { border-bottom: 1px solid var(--magic-cyan); padding: 10px; color: var(--magic-cyan); text-align: left; font-variant: small-caps; font-size: 0.8rem; }
        td { padding: 12px 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); vertical-align: middle; }

        .type-player { color: var(--player-glow); text-shadow: 0 0 10px rgba(14, 165, 233, 0.5); }
        .type-enemy { color: var(--enemy-glow); text-shadow: 0 0 10px rgba(239, 68, 68, 0.5); }
        .type-ally { color: var(--ally-glow); text-shadow: 0 0 10px rgba(34, 197, 94, 0.5); }

        .hp-input { width: 45px; text-align: center; padding: 5px; font-weight: bold; }
        .edit-input { width: 90%; padding: 4px; font-size: 0.9rem; }
        .hp-bar-bg { width: 100%; height: 6px; background: #334155; border-radius: 3px; margin-top: 5px; overflow: hidden; }
        .hp-bar-fill { height: 100%; transition: width 0.3s ease; }

        .total-roll { font-size: 1.5rem; font-weight: bold; color: #fff; line-height: 1;}
        .math { font-size: 0.7rem; color: var(--magic-cyan); display: block; }
        .bonus-text { color: var(--bg3-adv); }
        .penalty-text { color: var(--bg3-dis); }

        .bg3-icon-container { display: flex; gap: 8px; align-items: center; }
        .chevron {
            cursor: pointer; width: 18px; height: 18px; position: relative;
            opacity: 0.2; transition: 0.3s; filter: grayscale(1);
        }
        .adv-chevron::before, .adv-chevron::after {
            content: ''; position: absolute; width: 8px; height: 8px;
            border-left: 2.5px solid var(--bg3-adv); border-top: 2.5px solid var(--bg3-adv);
            transform: rotate(45deg); left: 4px;
        }
        .adv-chevron::after { top: 5px; }
        .dis-chevron::before, .dis-chevron::after {
            content: ''; position: absolute; width: 8px; height: 8px;
            border-right: 2.5px solid var(--bg3-dis); border-bottom: 2.5px solid var(--bg3-dis);
            transform: rotate(45deg); left: 4px;
        }
        .dis-chevron::after { top: 5px; }
        .active-adv { opacity: 1; filter: grayscale(0) drop-shadow(0 0 5px var(--bg3-adv)); }
        .active-dis { opacity: 1; filter: grayscale(0) drop-shadow(0 0 5px var(--bg3-dis)); }

        .status-pill {
            background: rgba(14, 165, 233, 0.3); border: 1px solid var(--magic-cyan);
            padding: 2px 6px; border-radius: 4px; font-size: 10px; margin: 1px; display: inline-flex; align-items: center;
        }

        .icon-btn { background: none; border: none; cursor: pointer; font-size: 1.1rem; padding: 5px; opacity: 0.7; }
        .icon-btn:hover { opacity: 1; }
    </style>
</head>
<body>

<div class="frosted-card", style="text-align: center;">
    <h1>Convergence of Faerûn </h1>
    <h2>The frozen Smiling City </h2>
    <div class="round-counter">❄️ ROUND <span id="roundNum">0</span> ❄️</div>
    
    <div class="input-row">
        <input type="text" id="name" placeholder="Name">
        <select id="type">
            <option value="player">Player</option>
            <option value="enemy" selected>Enemy</option>
            <option value="ally">Ally</option>
        </select>
        <input type="number" id="hp" placeholder="HP">
        <input type="number" id="mod" placeholder="Dex">
        <input type="number" id="qty" placeholder="Qty" value="1" min="1">
        <button onclick="addParticipant()" style="background:var(--magic-cyan); color:white; border:none; padding:8px 15px; border-radius:4px; cursor:pointer; font-weight:bold;">ADD</button>
    </div>

    <button class="btn-roll" onclick="nextRound()">🧊 Shatter the Ice (Next Round) 🧊</button>

    <table>
        <thead>
            <tr>
                <th style="width:18%">Combatant</th>
                <th style="width:15%">HP (Cur/Max)</th>
                <th style="width:10%">Adv/Dis (+/-5)</th>
                <th style="width:12%">Exhaustion</th>
                <th style="width:12%">Initiative</th>
                <th style="width:23%">Conditions</th>
                <th style="width:10%">Actions</th>
            </tr>
        </thead>
        <tbody id="initBody"></tbody>
    </table>
    
    <button onclick="clearAll()" style="background:none; border:1px solid #ef4444; color:#ef4444; font-size:10px; margin-top:20px; cursor:pointer; padding:5px; border-radius:4px;">WIPE ALL DATA</button>
</div>

<script>
    let participants = JSON.parse(localStorage.getItem('dnd_init_data')) || [];
    let round = parseInt(localStorage.getItem('dnd_init_round')) || 0;
    let editingIndex = null;
    const conditions = ["Blinded", "Charmed", "Deafened", "Frightened", "Grappled", "Incapacitated", "Invisible", "Paralyzed", "Petrified", "Poisoned", "Prone", "Restrained", "Stunned", "Unconscious"];

    function saveToStorage() {
        localStorage.setItem('dnd_init_data', JSON.stringify(participants));
        localStorage.setItem('dnd_init_round', round);
    }

    function createSnowflake() {
        const snow = document.createElement('div');
        snow.innerHTML = "❄";
        snow.classList.add('snowflake');
        snow.style.left = Math.random() * 100 + 'vw';
        snow.style.animationDuration = Math.random() * 3 + 4 + 's';
        snow.style.fontSize = Math.random() * 10 + 10 + 'px';
        snow.style.opacity = Math.random() * 0.5 + 0.3;
        document.body.appendChild(snow);
        setTimeout(() => { snow.remove(); }, 7000);
    }
    setInterval(createSnowflake, 300);

    function parseValue(val, fallback) {
        let parsed = parseInt(val);
        return isNaN(parsed) ? fallback : parsed;
    }

    function calculateTotal(p) {
        let total = p.nat + p.mod;
        if (p.adv) total += 5;
        if (p.dis) total -= 5;
        total -= (p.exhaustion * 2);
        return total;
    }

    function sortParticipants() {
        participants.sort((a, b) => {
            const aTot = calculateTotal(a);
            const bTot = calculateTotal(b);
            if (bTot !== aTot) return bTot - aTot;
            if (b.mod !== a.mod) return b.mod - a.mod;
            if (!a.tieBreak) a.tieBreak = Math.random();
            if (!b.tieBreak) b.tieBreak = Math.random();
            return b.tieBreak - a.tieBreak;
        });
    }

    function addParticipant() {
        const n = document.getElementById('name').value;
        const t = document.getElementById('type').value;
        const m = parseValue(document.getElementById('mod').value, 0);
        const hp = parseValue(document.getElementById('hp').value, 10);
        const qty = parseValue(document.getElementById('qty').value, 1);
        if (!n) return;

        for (let i = 1; i <= qty; i++) {
            const displayName = qty > 1 ? `${n} ${i}` : n;
            const nat = Math.floor(Math.random() * 20) + 1;
            const newP = { 
                name: displayName, type: t, mod: m, maxHp: hp, curHp: hp,
                nat: nat, statuses: [], adv: false, dis: false, 
                exhaustion: 0, tieBreak: Math.random() 
            };
            newP.current = calculateTotal(newP);
            participants.push(newP);
        }
        
        document.getElementById('name').value = ''; 
        document.getElementById('hp').value = '';
        document.getElementById('qty').value = '1';
        sortParticipants(); saveToStorage(); render();
    }

    function toggleEdit(i) {
        editingIndex = (editingIndex === i) ? null : i;
        render();
    }

    function saveQuickEdit(i) {
        const newName = document.getElementById(`edit-name-${i}`).value;
        const newMod = parseValue(document.getElementById(`edit-mod-${i}`).value, 0);
        participants[i].name = newName;
        participants[i].mod = newMod;
        participants[i].current = calculateTotal(participants[i]);
        editingIndex = null;
        sortParticipants(); saveToStorage(); render();
    }

    function nextRound() {
        round++;
        participants.forEach(p => {
            p.nat = Math.floor(Math.random()*20)+1;
            p.current = calculateTotal(p);
            p.tieBreak = Math.random();
        });
        sortParticipants(); saveToStorage(); render();
    }

    function toggleAdv(i) {
        participants[i].adv = !participants[i].adv;
        if (participants[i].adv) participants[i].dis = false;
        participants[i].current = calculateTotal(participants[i]);
        sortParticipants(); saveToStorage(); render();
    }

    function toggleDis(i) {
        participants[i].dis = !participants[i].dis;
        if (participants[i].dis) participants[i].adv = false;
        participants[i].current = calculateTotal(participants[i]);
        sortParticipants(); saveToStorage(); render();
    }

    function clearAll() { if(confirm("Wipe all data?")) { participants = []; round = 0; saveToStorage(); location.reload(); } }

    function render() {
        document.getElementById('roundNum').innerText = round;
        const tbody = document.getElementById('initBody');
        tbody.innerHTML = '';
        participants.forEach((p, i) => {
            const tr = document.createElement('tr');
            const hpPct = Math.min(Math.max((p.curHp / p.maxHp) * 100, 0), 100);
            const barColor = p.type === 'enemy' ? 'var(--hp-red)' : (p.type === 'player' ? 'var(--player-glow)' : 'var(--hp-green)');
            if (p.exhaustion >= 6 || p.curHp <= 0) tr.style.opacity = "0.4";

            if (editingIndex === i) {
                tr.innerHTML = `
                    <td class="type-${p.type}">
                        <input type="text" id="edit-name-${i}" class="edit-input" value="${p.name}"><br>
                        <small>Modifier: </small><input type="number" id="edit-mod-${i}" style="width:40px; padding:2px" value="${p.mod}">
                    </td>
                    <td colspan="5" style="text-align:center; color:var(--magic-cyan); font-style:italic;">Editing Details...</td>
                    <td>
                        <button class="icon-btn" onclick="saveQuickEdit(${i})">💾</button>
                        <button class="icon-btn" onclick="toggleEdit(null)">❌</button>
                    </td>
                `;
            } else {
                tr.innerHTML = `
                    <td class="type-${p.type}"><strong>${p.name}</strong><br><small style="color:rgba(255,255,255,0.5)">${p.type.toUpperCase()} (Mod: ${p.mod >= 0 ? '+' : ''}${p.mod})</small></td>
                    <td>
                        <div style="display:flex; align-items:center; gap:5px;">
                            <input type="number" class="hp-input" value="${p.curHp}" onchange="participants[${i}].curHp=parseInt(this.value);saveToStorage();render();">
                            <span>/</span>
                            <input type="number" class="hp-input" value="${p.maxHp}" onchange="participants[${i}].maxHp=parseInt(this.value);saveToStorage();render();">
                        </div>
                        <div class="hp-bar-bg"><div class="hp-bar-fill" style="width:${hpPct}%; background:${barColor}; box-shadow: 0 0 5px ${barColor}"></div></div>
                    </td>
                    <td>
                        <div class="bg3-icon-container">
                            <div class="chevron adv-chevron ${p.adv ? 'active-adv' : ''}" onclick="toggleAdv(${i})"></div>
                            <div class="chevron dis-chevron ${p.dis ? 'active-dis' : ''}" onclick="toggleDis(${i})"></div>
                        </div>
                    </td>
                    <td>
                        <select onchange="participants[${i}].exhaustion=parseInt(this.value); participants[${i}].current=calculateTotal(participants[${i}]); sortParticipants(); saveToStorage(); render();" style="width:100%; font-size:11px;">
                            ${[0,1,2,3,4,5,6].map(l => `<option value="${l}" ${p.exhaustion==l?'selected':''}>Lvl ${l}</option>`).join('')}
                        </select>
                    </td>
                    <td>
                        <span class="total-roll">${p.exhaustion >= 6 || p.curHp <= 0 ? '💀' : p.current}</span>
                        <span class="math">
                            ${p.nat}${p.mod>=0?'+':''}${p.mod}
                            ${p.adv ? '<span class="bonus-text">+5</span>' : ''}
                            ${p.dis ? '<span class="penalty-text">-5</span>' : ''}
                            ${p.exhaustion > 0 ? `<span class="penalty-text">-${p.exhaustion*2}</span>` : ''}
                        </span>
                    </td>
                    <td>
                        <div style="max-height: 45px; overflow-y: auto;">
                            ${p.statuses.map((s, si) => `<span class="status-pill">${s} <span onclick="participants[${i}].statuses.splice(${si},1);saveToStorage();render();" style="cursor:pointer;margin-left:4px">×</span></span>`).join('')}
                        </div>
                        <select onchange="if(this.value){participants[${i}].statuses.push(this.value);saveToStorage();render();}" style="font-size:10px; margin-top:3px; width:100%;">
                            <option value="">+ Status</option>
                            ${conditions.map(c => `<option value="${c}">${c}</option>`).join('')}
                        </select>
                    </td>
                    <td>
                        <button class="icon-btn" title="Quick Edit" onclick="toggleEdit(${i})">✍️</button>
                        <button class="icon-btn" title="Remove" onclick="participants.splice(${i},1);saveToStorage();render();">☠️</button>
                    </td>
                `;
            }
            tbody.appendChild(tr);
        });
    }
    render();
</script>
</body>
</html>
